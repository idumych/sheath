name: appimage

# The app for any x86_64 Linux desktop, built with Cosmoe on Ubuntu 24.04 so
# the AppImage runs on that glibc or newer. Run it by hand before a release
# (gh workflow run appimage.yml --ref <branch>) and test that artifact; on a
# v* tag it attaches an AppImage to the release only if none is attached yet,
# so the tested one that SHA256SUMS describes is kept.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: App settings
        id: app
        run: |
          . ./haiku-app.env
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "apt=$APPIMAGE_APT_EXTRA" >> "$GITHUB_OUTPUT"
          echo "cosmoe=$(sed -n 's/^COSMOE_TAG=//p' packaging/appimage/build-appimage.sh)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config flex bison curl file \
            libcairo2-dev libpng-dev libjpeg-dev libwebp-dev libtiff-dev \
            zlib1g-dev libicu-dev libpango1.0-dev libicns-dev libraw-dev \
            libpixman-1-dev libfontconfig1-dev libglib2.0-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libfuse3-dev desktop-file-utils \
            ${{ steps.app.outputs.apt }}

      - name: Cache Cosmoe build
        uses: actions/cache@v4
        with:
          path: .cosmoe/stage
          key: cosmoe-${{ steps.app.outputs.cosmoe }}-ubuntu-24.04-release

      - name: Build AppImage
        run: sh packaging/appimage/build-appimage.sh

      - name: Wayland smoke test (headless Weston)
        timeout-minutes: 10
        # Cosmoe picks its Wayland backend from WAYLAND_DISPLAY / COSMOE_BACKEND. Start the
        # AppImage on a headless Weston, check it stays up, and keep a screenshot to look at.
        run: |
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y --no-install-recommends weston
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p wayland-smoke
          weston --backend=headless --renderer=pixman --width=1280 --height=800 \
            --socket=wl-ci --debug --idle-time=0 > wayland-smoke/weston.log 2>&1 &
          for i in $(seq 20); do [ -S "$XDG_RUNTIME_DIR/wl-ci" ] && break; sleep 0.5; done
          [ -S "$XDG_RUNTIME_DIR/wl-ci" ] || { echo "weston did not start:"; cat wayland-smoke/weston.log; exit 1; }
          APP=$(ls ${{ steps.app.outputs.name }}-*.AppImage)
          env -u DISPLAY WAYLAND_DISPLAY=wl-ci COSMOE_BACKEND=wayland APPIMAGE_EXTRACT_AND_RUN=1 \
            HOME=$(mktemp -d) "./$APP" > wayland-smoke/app.log 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 $PID 2>/dev/null; then
            echo "The app exited under Wayland:"; cat wayland-smoke/app.log; exit 1
          fi
          (cd wayland-smoke && WAYLAND_DISPLAY=wl-ci timeout 30 weston-screenshooter) || echo "screenshot failed"
          kill $PID; sleep 1
          ls -l wayland-smoke; tail -5 wayland-smoke/app.log
          ! grep -qiE 'error|assert|crash|segment|abort|exception' wayland-smoke/app.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-smoke
          path: wayland-smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: ${{ steps.app.outputs.name }}-*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -q '\.AppImage$'; then
            echo "Release already has an AppImage; leaving it."
          else
            gh release upload "${GITHUB_REF_NAME}" ${{ steps.app.outputs.name }}-*.AppImage
          fi
